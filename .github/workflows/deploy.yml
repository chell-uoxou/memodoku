name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも流せるようにしておく
  workflow_dispatch:

# GITHUB_TOKEN に Pages へのデプロイ権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。走行中のものは終わらせてから次を流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # tsc -b && vite build。base は './' なのでサブパス配信でもそのまま動く
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
